<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D100E" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parte Diario">
<title>Parte Diario</title>
<style>
:root{
  --bg:#F2F3EF;--sf:#FFFFFF;--fg:#121712;--mut:#454D45;--bd:#C4CAC1;--ac:#1D6630;--onac:#FFFFFF;--acs:#DCEDDF;--btn:#E8EBE5;
  --dn:#B3261E;--ondn:#FFFFFF;--dnsoft:#FBE4E1;--scrim:rgba(12,16,12,.55);--toast:#1B211C;--ontoast:#FFFFFF;--toastac:#8FE0A2;
  --t0:#E2EDF8;--b0:#93B4D6;--t1:#FAEAD5;--b1:#D6AC72;--t2:#E3F0DF;--b2:#97C08F;--t3:#F0E6F6;--b3:#BFA2D3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D100E;--sf:#1B201C;--fg:#F1F4EF;--mut:#B9C1B7;--bd:#3B443C;--ac:#7BD58F;--onac:#08170C;--acs:#1E3824;--btn:#272E28;
  --dn:#FF8A80;--ondn:#2A0805;--dnsoft:#3A1A17;--scrim:rgba(0,0,0,.72);--toast:#E9EEE7;--ontoast:#121712;--toastac:#1D6630;
  --t0:#13253A;--b0:#2E5375;--t1:#33240E;--b1:#6B5023;--t2:#14301A;--b2:#336239;--t3:#2A1C33;--b3:#5A3F6C;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-weight:500;font-size:16px;overscroll-behavior:none}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:active{filter:brightness(.92)}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--ac);outline-offset:2px}
#app{position:fixed;inset:0;max-width:600px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.top{padding:calc(env(safe-area-inset-top) + 12px) max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px;border-bottom:2px solid var(--bd);background:var(--bg)}
.row{display:flex;align-items:center;gap:8px}
.ib{width:56px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:16px;background:var(--btn);color:var(--fg);text-decoration:none;padding:0}
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,env(safe-area-inset-left)) 24px;display:flex;flex-direction:column;gap:16px}
.bottom{background:var(--sf);border-top:2px solid var(--bd);padding:10px max(16px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:10px}
.muted{color:var(--mut);font-size:18px}
h1{font-size:28px;font-weight:800;line-height:1.15}
h2{font-size:22px;font-weight:800}
.card{background:var(--sf);border:2px solid var(--bd);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{white-space:nowrap;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--bd);border-radius:16px;background:var(--btn);color:var(--fg);font-size:20px;font-weight:800;padding:0 12px;text-decoration:none}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.btn.sec{background:var(--acs);border-color:var(--ac)}
.btn.ghost{background:transparent}
.btn.dn{background:transparent;border-color:var(--dn);color:var(--dn)}
.btn[disabled]{opacity:.4}
.finca{border:2px solid;border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:10px}
.tarea{background:var(--sf);border-radius:16px;padding:14px 12px 12px 14px;display:flex;flex-direction:column;gap:12px}
.tarea .nm{font-size:22px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.cnt{width:64px;height:56px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bd);border-radius:14px;background:var(--btn);padding:0}
.cnt.plus{border-color:var(--ac);background:var(--acs);color:var(--ac)}
.num{width:76px;height:56px;padding:0;text-align:center;border:2px solid var(--bd);border-radius:14px;background:var(--bg);font-size:30px;font-weight:800}
.dots{width:56px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--bd);border-radius:14px;background:transparent;padding:0}
.add{height:56px;display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed;border-radius:16px;background:transparent;font-size:20px;font-weight:800}
.scrim{position:absolute;inset:0;border:0;background:var(--scrim);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;gap:8px;padding:12px max(16px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 14px);border-radius:28px 28px 0 0;background:var(--sf);color:var(--fg);max-height:92%}
.grab{width:44px;height:5px;border-radius:3px;align-self:center;background:var(--bd)}
.sbtn{height:64px;display:flex;align-items:center;gap:16px;padding:0 20px;border:0;border-radius:16px;background:var(--btn);color:var(--fg);font-size:22px;font-weight:700;text-align:left}
.sbtn[disabled]{opacity:.4}
.dlg{position:absolute;left:16px;right:16px;top:20%;z-index:30;display:flex;flex-direction:column;gap:10px;padding:24px 20px 20px;border-radius:24px;background:var(--sf);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.toast{position:absolute;left:12px;right:12px;z-index:40;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 18px;border-radius:16px;background:var(--toast);color:var(--ontoast);box-shadow:0 10px 28px rgba(0,0,0,.3);bottom:calc(env(safe-area-inset-bottom) + 170px);font-size:18px}
.toast.low{bottom:calc(env(safe-area-inset-bottom) + 24px)}
.toast .u{height:56px;padding:0 16px;border:0;border-radius:12px;background:transparent;color:var(--toastac);font-size:20px;font-weight:800}
.sug{min-height:60px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 16px;border:0;border-radius:14px;background:var(--btn);color:var(--fg);font-size:20px;font-weight:700;text-align:left}
.txt{height:60px;min-width:0;padding:0 14px;border:2px solid var(--ac);border-radius:14px;background:var(--bg);font-size:20px;font-weight:700;text-transform:uppercase;width:100%}
.day{min-height:80px;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 18px;border-radius:18px;background:var(--sf);border:2px solid var(--sf);color:var(--fg);text-decoration:none}
.day.hoy{border-color:var(--ac)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:16px;background:var(--btn)}
.seg button{height:52px;border:0;border-radius:12px;background:transparent;font-size:20px;font-weight:800}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--onac)}
.stat{background:var(--bg);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:32px;font-weight:800;line-height:1}
.stat span{font-size:18px;color:var(--mut)}
.prev{background:var(--sf);border:2px solid var(--bd);border-radius:18px;padding:16px 18px;font-size:18px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="file" accept="application/json,.json" class="sr" tabindex="-1">
<script>
'use strict';
/* ───────── Utilidades ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const up = s => String(s || '').trim().replace(/\s+/g, ' ').toLocaleUpperCase('es');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const key = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return key(d); };
const hoyK = () => key(new Date());
const DS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const DL = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const MS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const dmy = k => { const d = parse(k); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
const dm = k => { const d = parse(k); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const corto = k => DS[parse(k).getDay()] + ' ' + dm(k);
const largo = k => { const d = parse(k); return DL[d.getDay()] + ', ' + d.getDate() + ' de ' + MS[d.getMonth()].toLowerCase() + ' de ' + d.getFullYear(); };
const pl = n => n === 1 ? '1 persona' : n + ' personas';
const fmt1 = n => (Math.round(n * 10) / 10).toString().replace('.', ',');

/* ───────── Datos ───────── */
const LS = 'parteDiario.v1';
let db = cargar();
function vacioDB() { return { v: 1, redactor: 'YIYO', partes: {}, ultimaCopia: null, ocultarInstalar: false }; }
function cargar() {
  try {
    const r = JSON.parse(localStorage.getItem(LS));
    if (r && r.partes) return Object.assign(vacioDB(), r);
  } catch (e) {}
  return vacioDB();
}
function guardar() {
  try { localStorage.setItem(LS, JSON.stringify(db)); }
  catch (e) { alert('No se pudo guardar en el móvil. Exporta una copia desde Ajustes.'); }
}
const totalFinca = f => f.tareas.reduce((a, k) => a + (k.n || 0), 0);
const totalParte = p => p.fincas.reduce((a, f) => a + totalFinca(f), 0);
const nTareas = p => p.fincas.reduce((a, f) => a + f.tareas.length, 0);
const fechas = () => Object.keys(db.partes).sort();
function anteriorA(k) { const l = fechas().filter(x => x < k); return l.length ? l[l.length - 1] : null; }
function sugerencias() {
  const m = {};
  for (const p of Object.values(db.partes)) for (const f of p.fincas) for (const t of f.tareas) m[t.nombre] = (m[t.nombre] || 0) + 1;
  return Object.entries(m).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'es')).map(e => e[0]);
}
function textoParte(k) {
  const p = db.partes[k];
  let s = '*PARTE DIARIO · ' + dmy(k) + '*\nRedactado por: ' + (db.redactor || 'YIYO') + '\n';
  for (const f of p.fincas) {
    s += '\n*' + f.nombre + '*\n';
    for (const t of f.tareas) s += t.nombre + ': ' + t.n + '\n';
    s += 'Total finca: ' + totalFinca(f) + '\n';
  }
  return s + '\n*TOTAL: ' + pl(totalParte(p)) + '*';
}
function resumen(per) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const fin = key(hoy);
  let ini, etiqueta;
  if (per === 'mes') {
    ini = key(new Date(hoy.getFullYear(), hoy.getMonth(), 1));
    etiqueta = MS[hoy.getMonth()] + ' ' + hoy.getFullYear() + ' (hasta hoy)';
  } else {
    const off = (hoy.getDay() + 6) % 7;
    ini = addDays(fin, -off);
    const a = parse(ini), b = hoy;
    etiqueta = 'Semana del ' + a.getDate() + (a.getMonth() !== b.getMonth() ? ' de ' + MS[a.getMonth()].toLowerCase() : '') + ' al ' + b.getDate() + ' de ' + MS[b.getMonth()].toLowerCase();
  }
  const ks = fechas().filter(k => k >= ini && k <= fin);
  const jor = ks.reduce((a, k) => a + totalParte(db.partes[k]), 0);
  return { etiqueta, partes: ks.length, jornadas: jor, media: ks.length ? jor / ks.length : 0 };
}

/* ───────── Estado de interfaz ───────── */
const ui = { sheet: null, toast: null, per: 'semana', modo: 'conservar', copiado: false, msgInstalar: '', texto: '' };
let toastT = null, copiaT = null, deferred = null;
const ruta = () => {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  const f = /^\d{4}-\d{2}-\d{2}$/.test(h[1] || '') ? h[1] : hoyK();
  if (h[0] === 'historial' || h[0] === 'ajustes') return { v: h[0] };
  if (h[0] === 'compartir') return { v: 'compartir', k: f };
  return { v: 'main', k: /^\d{4}-\d{2}-\d{2}$/.test(h[1] || '') ? h[1] : hoyK() };
};
const ir = h => { ui.sheet = null; ui.toast = null; location.hash = h; };

/* ───────── Iconos ───────── */
const I = (p, w = 28, sw = 2.3, fill) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="${fill ? 'none' : 'currentColor'}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC = {
  hist: I('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>'),
  set: I('<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>'),
  prev: I('<path d="M15 18l-6-6 6-6"/>', 30, 2.6),
  next: I('<path d="M9 18l6-6-6-6"/>', 30, 2.6),
  down: I('<path d="M6 9l6 6 6-6"/>', 22, 2.6),
  cal: I('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', 36, 2.2),
  plus: (w = 26, sw = 2.8) => I('<path d="M12 5v14M5 12h14"/>', w, sw),
  minus: I('<path d="M5 12h14"/>', 30, 3),
  plus3: I('<path d="M12 5v14M5 12h14"/>', 30, 3),
  more: I('<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>', 28, 0, true),
  copy: (w = 24) => I('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>', w),
  wa: (w = 26) => I('<path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/>', w),
  edit: I('<path d="M4 20h4L19 9l-4-4L4 16v4z"/>'),
  up: I('<path d="M12 19V5M5 12l7-7 7 7"/>', 28, 2.5),
  dn: I('<path d="M12 5v14M19 12l-7 7-7-7"/>', 28, 2.5),
  trash: (w = 28) => I('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', w),
  x: I('<path d="M6 6l12 12M18 6L6 18"/>', 28, 2.6),
  search: I('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', 26, 2.4),
  exp: I('<path d="M12 4v12M6 10l6 6 6-6M4 20h16"/>', 24, 2.5),
  imp: I('<path d="M12 20V8M6 14l6-6 6 6M4 4h16"/>', 24, 2.5),
  inst: I('<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3"/>')
};

/* ───────── Acciones sobre datos ───────── */
function parteDe(k) { return db.partes[k]; }
function crearParte(k) {
  const ant = anteriorA(k);
  const nombres = ant ? db.partes[ant].fincas.map(f => f.nombre) : ['UTXESA 1', 'UTXESA 2', 'UTXESA 3'];
  db.partes[k] = { creado: Date.now(), fincas: nombres.map((n, i) => ({ id: uid(), nombre: n, c: i % 4, tareas: [] })) };
  guardar(); render();
}
function copiarAnterior(k) {
  const ant = anteriorA(k);
  if (!ant) return;
  const cero = ui.modo === 'cero';
  db.partes[k] = { creado: Date.now(), fincas: db.partes[ant].fincas.map(f => ({ id: uid(), nombre: f.nombre, c: f.c, tareas: f.tareas.map(t => ({ id: uid(), nombre: t.nombre, n: cero ? 0 : t.n })) })) };
  guardar(); render();
}
function setN(k, fi, ti, n) { db.partes[k].fincas[fi].tareas[ti].n = Math.max(0, Math.min(999, n)); guardar(); }
function anadirTarea(k, fi, nombre) {
  const n = up(nombre);
  if (!n) return;
  db.partes[k].fincas[fi].tareas.push({ id: uid(), nombre: n, n: 1 });
  guardar(); ui.sheet = null; render();
}
function mover(k, sel, d) {
  const p = db.partes[k];
  const arr = sel.t === 'tarea' ? p.fincas[sel.fi].tareas : p.fincas;
  const i = sel.t === 'tarea' ? sel.ti : sel.fi, j = i + d;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  guardar(); ui.sheet = null; render();
}
function borrar(k, sel) {
  const p = db.partes[k];
  const item = sel.t === 'tarea' ? p.fincas[sel.fi].tareas.splice(sel.ti, 1)[0] : p.fincas.splice(sel.fi, 1)[0];
  guardar(); ui.sheet = null;
  ui.toast = { t: sel.t, fi: sel.fi, ti: sel.ti, item, k };
  clearTimeout(toastT); toastT = setTimeout(() => { ui.toast = null; render(); }, 9000);
  render();
}
function deshacer() {
  const b = ui.toast; if (!b || !db.partes[b.k]) return;
  const p = db.partes[b.k];
  if (b.t === 'tarea') { if (p.fincas[b.fi]) p.fincas[b.fi].tareas.splice(b.ti, 0, b.item); }
  else p.fincas.splice(b.fi, 0, b.item);
  guardar(); ui.toast = null; clearTimeout(toastT); render();
}
function renombrar(k, sel, nombre) {
  const n = up(nombre); if (!n) return;
  const p = db.partes[k];
  if (sel.t === 'tarea') p.fincas[sel.fi].tareas[sel.ti].nombre = n;
  else if (sel.t === 'finca') p.fincas[sel.fi].nombre = n;
  else p.fincas.push({ id: uid(), nombre: n, c: p.fincas.length % 4, tareas: [] });
  guardar(); ui.sheet = null; render();
}
async function copiarTexto(txt) {
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove();
  }
  ui.copiado = true; render(); clearTimeout(copiaT); copiaT = setTimeout(() => { ui.copiado = false; render(); }, 2000);
}
const waUrl = t => 'https://wa.me/?text=' + encodeURIComponent(t);

/* ───────── Vistas ───────── */
function cabeceraFecha(k) {
  const h = hoyK();
  const et = k === h ? 'Hoy · ' + dmy(k) : k === addDays(h, -1) ? 'Ayer · ' + dmy(k) : k === addDays(h, 1) ? 'Mañana · ' + dmy(k) : corto(k) + '/' + parse(k).getFullYear();
  return et;
}
function vMain(k) {
  const p = parteDe(k), tot = p ? totalParte(p) : 0;
  const ant = anteriorA(k);
  let cuerpo = '';
  if (!p) {
    const ap = ant ? db.partes[ant] : null;
    cuerpo = `<div style="display:flex;flex-direction:column;gap:16px;padding:12px 0">
      <div style="width:72px;height:72px;border-radius:36px;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center">${IC.cal}</div>
      <div><h1>${k === hoyK() ? 'Aún no hay parte de hoy' : 'No hay parte de este día'}</h1><div class="muted" style="margin-top:4px">${largo(k)}</div></div>
      <button class="btn pri" style="height:64px;font-size:22px;border-radius:16px" data-a="crear">${IC.plus(28)}Crear parte${k === hoyK() ? ' de hoy' : ''}</button>
      ${ap ? `<div class="card"><div><h2>¿Igual que antes?</h2><div class="muted">${corto(ant)} · ${ap.fincas.length} fincas · ${nTareas(ap)} tareas</div></div>
        <label style="min-height:56px;display:flex;align-items:center;gap:14px;padding:0 14px;border:2px solid ${ui.modo === 'conservar' ? 'var(--ac)' : 'var(--bd)'};border-radius:14px;font-size:20px;font-weight:700"><input type="radio" name="modo" value="conservar" ${ui.modo === 'conservar' ? 'checked' : ''} style="width:26px;height:26px;accent-color:var(--ac)">Conservar cantidades</label>

    case 'per': ui.per = el.dataset.p; render(); break;
    case 'exportar': exportar(); break;
    case 'importar': $('#file').value = ''; $('#file').click(); break;
    case 'confimportar': aplicarImport(ui.sheet.datos); break;
    case 'ahoranoinst': db.ocultarInstalar = true; guardar(); render(); break;
    case 'instalar': instalar(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, r = ruta();
  if (t.name === 'modo') { ui.modo = t.value; render(); }
  else if (t.id === 'datepick' && t.value) ir('#/d/' + t.value);
  else if (t.dataset.a === 'set') {
    const v = parseInt(String(t.value).replace(/\D/g, ''), 10);
    setN(r.k, +t.dataset.fi, +t.dataset.ti, isNaN(v) ? 0 : v); render();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'red') { db.redactor = up(t.value) || 'YIYO'; guardar(); }
  else if (t.id === 'q') { ui.q = t.value; render(); }
  else if (t.id === 'nt') { ui.sheet.q = t.value; $('#sugs').innerHTML = vSugs(t.value); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'nt') { e.preventDefault(); anadirTarea(ruta().k, ui.sheet.fi, e.target.value); }
  else if (e.key === 'Enter' && e.target.id === 'nn') { e.preventDefault(); $('[data-a=guardarnombre]').click(); }
  else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.a === 'set') e.target.blur();
  else if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); }
});

/* ───────── Copia de seguridad ───────── */
function exportar() {
  const blob = new Blob([JSON.stringify({ app: 'parte-diario', version: 1, exportado: new Date().toISOString(), datos: db }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'parte-diario-' + hoyK() + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  db.ultimaCopia = hoyK(); guardar(); render();
}
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const d = j.datos || j;
    if (!d || typeof d.partes !== 'object') throw 0;
    for (const [k, p] of Object.entries(d.partes)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(p.fincas)) throw 0;
    }
    ui.sheet = { type: 'importar', datos: d, n: Object.keys(d.partes).length }; render();
  } catch (_) { alert('El archivo no es una copia válida de Parte Diario.'); }
});
function aplicarImport(d) {
  for (const [k, p] of Object.entries(d.partes)) {
    db.partes[k] = { creado: p.creado || Date.now(), fincas: p.fincas.map((f, i) => ({ id: uid(), nombre: up(f.nombre), c: f.c == null ? i % 4 : f.c % 4, tareas: (f.tareas || []).map(t => ({ id: uid(), nombre: up(t.nombre), n: Math.max(0, Math.min(999, parseInt(t.n, 10) || 0)) })) })) };
  }
  if (d.redactor && db.redactor === 'YIYO') db.redactor = up(d.redactor);
  guardar(); ui.sheet = null; render();
}

/* ───────── PWA ───────── */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
window.addEventListener('appinstalled', () => { deferred = null; render(); });
async function instalar() {
  if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; render(); return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  ui.msgInstalar = ios ? 'En Safari: toca el botón Compartir y elige «Añadir a pantalla de inicio».' : 'Abre el menú del navegador (⋮) y elige «Instalar aplicación» o «Añadir a pantalla de inicio».';
  render();
}
(function pwa() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const x = c.getContext('2d');
    x.fillStyle = '#1D6630'; x.fillRect(0, 0, 512, 512);
    x.fillStyle = '#fff'; x.fillRect(136, 120, 240, 290); x.fillStyle = '#1D6630'; x.fillRect(136, 120, 240, 60);
    x.fillStyle = '#1D6630'; for (let i = 0; i < 3; i++) x.fillRect(172, 216 + i * 56, 168, 20);
    c.toBlob(b => {
      const url = URL.createObjectURL(b);
      const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
      const man = { name: 'Parte Diario', short_name: 'Parte Diario', lang: 'es', display: 'standalone', orientation: 'portrait', background_color: '#F2F3EF', theme_color: '#1D6630', start_url: location.href.split('#')[0], scope: location.href.split('#')[0].replace(/[^/]*$/, ''), icons: [{ src: c.toDataURL('image/png'), sizes: '512x512', type: 'image/png', purpose: 'any' }, { src: c.toDataURL('image/png'), sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
      const m = document.createElement('link'); m.rel = 'manifest';
      m.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
      document.head.appendChild(m);
    }, 'image/png');
  } catch (_) {}
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();

render();
</script>
